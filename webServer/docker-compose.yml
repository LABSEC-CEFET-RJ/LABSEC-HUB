services:

  api:
    container_name: labsec_node
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - db
      - adminer
  db:
    container_name: labsec_postgres
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  adminer:
    container_name: labsec_adminer
    image: adminer
    ports:
      - "8080:8080"
volumes:
  postgres_data: