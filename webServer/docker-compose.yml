services:

  api:
    container_name: labsec_node
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - labsec_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  db:
    container_name: labsec_postgres
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - labsec_net
      
  adminer:
    container_name: labsec_adminer
    restart: always
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - labsec_net

networks:
  labsec_net:
    driver: bridge

volumes:
  postgres_data: